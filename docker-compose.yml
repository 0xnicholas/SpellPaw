services:
  db:
    # pg16 image (pgvector included); pg17 not yet available in this environment's local cache
    image: pgvector/pgvector:pg16
    container_name: spellpaw-db
    environment:
      POSTGRES_USER: spellpaw
      POSTGRES_PASSWORD: spellpaw
      POSTGRES_DB: spellpaw
    # Host port 5433 — 5432 is taken by Postgres.app on this machine
    ports:
      - "5433:5432"
    volumes:
      - spellpaw-pg:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spellpaw -d spellpaw"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.0-alpine
    container_name: spellpaw-redis
    ports:
      - "6379:6379"
    volumes:
      - spellpaw-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spellpaw-pg:
  spellpaw-redis:
